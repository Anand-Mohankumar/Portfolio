name: Refresh curated newsfeed
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/refresh-newsfeed.py
      - .github/workflows/refresh-newsfeed.yml
permissions:
  contents: write
concurrency:
  group: refresh-newsfeed
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/refresh-newsfeed.py
      - name: Publish feed data
        run: |
          if git diff --quiet -- newsfeed; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add newsfeed/*.json
          git commit -m "Refresh curated newsfeed"
          git pull --rebase origin main
          git push origin HEAD:main
