<!doctype html>
<!-- CyberAmo social post, 1080 x 1080 (Instagram feed, LinkedIn square).
     Render: python scripts/render.py this.html out.png --width 1080 --height 1080 --scale 2
     Type floor at 1x: headline >= 64px, body >= 30px, footer >= 24px. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Social post</title>
<link rel="stylesheet" href="../theme.css">
<style>
  .canvas { width: 1080px; height: 1080px; }
  .content { padding: 72px; display: flex; flex-direction: column; }
  .eyebrow { font-size: 24px; }
  .headline { font-size: 76px; margin-top: 20px; }
  .subhead { font-size: 34px; margin-top: 24px; max-width: 26ch; }
  .panel { padding: 36px 40px; margin-top: 40px; }
  .panel-label { font-size: 20px; }
  .body { font-size: 32px; }
  .brand-footer { margin-top: auto; font-size: 24px; }
</style>
</head>
<body>
<div class="canvas">
  <div class="ambient preset-1">
    <div class="blob orange"></div><div class="blob teal"></div><div class="blob burnt"></div>
    <div class="vignette"></div>
  </div>
  <div class="content">
    <p class="eyebrow">Eyebrow label</p>
    <h1 class="headline">Headline with one <span class="accent">accent</span> word</h1>
    <p class="subhead">A one or two line supporting sentence that sets up the point.</p>
    <div class="panel solid">
      <div class="panel-label">Key point</div>
      <p class="body">The single idea this post carries. Keep it to three lines at most.</p>
    </div>
    <div class="brand-footer">
      <span class="wordmark">Cyber<b>Amo</b></span>
      <span>cyberamo.work</span>
    </div>
  </div>
</div>
</body>
</html>
